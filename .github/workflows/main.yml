name: Deploy Prod

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install mkdocs mkdocs-material neoteroi-mkdocs mkdocs-minify-plugin

      - name: Build site
        run: mkdocs build

      - name: Create CNAME file
        run: echo "www.tousauverger.fr" > site/CNAME

      - name: Build and Deploy
        env:
          SITE_URL: https://www.tousauverger.fr/
        run: mkdocs gh-deploy --remote-branch gh-pages --force
